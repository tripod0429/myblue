---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# `name` must match the GitHub repo name and the constants in
# files/system/usr/libexec/secureblue/verify-provenance.sh (the build checks).
name: myblue
description: Personal layer on top of secureblue

# Match the image you run today (see `rpm-ostree status`).
base-image: ghcr.io/secureblue/cosmic-main-hardened
image-version: latest

# Same as secureblue's own recipes: don't add cosign or nushell to the image.
cosign-version: none
nushell-version: none

# Every module is pinned to the modules image secureblue pins in
# recipes/common/common-modules.yml. Bump it when they do.
modules:
  - type: dnf
    source: ghcr.io/blue-build/modules@sha256:f1273b17987eed439b0feff77bf4b7f1c734e6f77607dc99c9de9d9070555c7a
    install:
      install-weak-deps: false
      packages:
        # Doom Emacs runs inside Bubblejail, which sees the host's /usr
        # but not Homebrew, so its tools come from Fedora.
        - emacs
        - ripgrep
        - fd-find
        # Build toolchain for GHC/cabal (ghcup) and Emacs native modules.
        - gcc-c++
        - make
        - cmake
        - libtool
        - gmp-devel
        - zenity
        # Local LLMs in rootless podman containers. The model service that
        # starts at login is a quadlet in the dotfiles.
        - ramalama
        # fido2-token, for `ujust audit-security-key`. The image already has
        # its library (libfido2); this is only the command-line tool.
        - fido2-tools

  # files/system/ is copied to / :
  # - Trivalent managed policies (correct SELinux labels, no restorecon)
  # - myblue-setup, the one-time setup helper
  # - verify-provenance.sh, replacing secureblue's so updates check
  #   this repo's provenance instead of secureblue's
  # - source-commit, generated by CI as the floor for future source histories
  # - the tmpfiles.d link from /opt to Mullvad's files in /usr/lib/opt
  # - keyaudit.sh, behind `ujust audit-security-key`
  - type: files
    source: ghcr.io/blue-build/modules@sha256:f1273b17987eed439b0feff77bf4b7f1c734e6f77607dc99c9de9d9070555c7a
    files:
      - source: system
        destination: /

  # files/justfiles/ is added to ujust: add-luks-fido2-key enrolls another
  # FIDO2 key for disk unlock (secureblue's setup-luks-fido2-unlock replaces
  # the enrolled key instead); audit-security-key reports what the plugged-in
  # key is used for and what a backup key still needs.
  - type: justfiles
    source: ghcr.io/blue-build/modules@sha256:f1273b17987eed439b0feff77bf4b7f1c734e6f77607dc99c9de9d9070555c7a
    validate: true

  # Script files rather than snippets: the module runs each line of a
  # snippet on its own.
  # - install-proton-bridge.sh: latest Proton Mail Bridge, from Proton's
  #   signed RPM (no dnf repo exists), checked against files/keys/
  # - install-mullvad.sh: latest Mullvad VPN daemon and CLI, without the
  #   GUI, from Mullvad's signed RPM, checked the same way
  # - myblue-image-setup.sh: build-time checks, permissions, policy.json
  - type: script
    source: ghcr.io/blue-build/modules@sha256:f1273b17987eed439b0feff77bf4b7f1c734e6f77607dc99c9de9d9070555c7a
    scripts:
      - install-proton-bridge.sh
      - install-mullvad.sh
      - myblue-image-setup.sh
      # Reapply secureblue's final package hardening after our installs.
      # Vendored unchanged; upstream/README.md records the source commit.
      # Keep the base image's metadata, initramfs and audit baseline.
      - upstream/remove-pdf-thumbnailers.sh
      - upstream/checksinglekernel.sh
      - upstream/removesuid.sh
      - upstream/removesudo.sh
      - upstream/ensure-packages-absent.sh
      - upstream/check-selinux-fcontext.sh
      - upstream/libdnf5-clear-history.sh

  # Installs cosign.pub and adds this image to policy.json, so rpm-ostree
  # only accepts images signed with your key.
  - type: signing
    source: ghcr.io/blue-build/modules@sha256:f1273b17987eed439b0feff77bf4b7f1c734e6f77607dc99c9de9d9070555c7a
