name: build

on:
  schedule:
    - cron: "17 9 * * *" # daily, a few hours after secureblue's 06:00 UTC build
    - cron: "47 * * * *" # hourly: builds only if secureblue published a new base
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch: # manual rebuild; deliberately takes no inputs

permissions: {}

# Never build two images at once: the digest read after the push must be
# the one this run produced.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Pushes, manual runs and the daily schedule always build. The hourly
  # schedule builds only when secureblue's base differs from the one the
  # published image was built on, or when that image fails its provenance
  # check (e.g. an earlier run stopped before provenance was attached).
  check:
    name: Check for a new base
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Restrict runner egress
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            release-assets.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            rekor.sigstore.dev:443

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test Bridge verification
        run: python3 -m unittest discover -s tests -v

      - name: Install slsa-verifier
        uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1

      - name: Install regctl
        uses: regclient/actions/regctl-installer@1b705e32d40851370799ea5814e83d0a5f6a70dc # v0.1.0

      - name: Decide whether to build
        id: check
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$(yq -r '.name' recipes/recipe.yml)"
          base="$(yq -r '."base-image"' recipes/recipe.yml):$(yq -r '."image-version"' recipes/recipe.yml)"
          if [[ $EVENT != schedule || $SCHEDULE == "17 9 * * *" ]]; then
            reason="$EVENT run"
            build=true
          elif ! digest=$(regctl image digest "${image}:latest"); then
            reason="no published image"
            build=true
          elif ! slsa-verifier verify-image --source-uri "github.com/${GITHUB_REPOSITORY,,}" \
              --source-branch main "${image}@${digest}" > /dev/null; then
            reason="published image fails its provenance check"
            build=true
          else
            base_now=$(regctl image digest "$base")
            built_on=$(regctl image config "${image}@${digest}" |
              jq -r '.config.Labels["org.opencontainers.image.base.digest"] // empty')
            if [[ $base_now != "$built_on" ]]; then
              reason="new base ${base_now} (published image built on ${built_on:-unknown})"
              build=true
            else
              reason="base unchanged (${base_now})"
              build=false
            fi
          fi
          echo "build=${build}: ${reason}"
          echo "build=${build}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and sign
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest # standard runner; larger runners are billed
    environment: release # holds SIGNING_SECRET, limited to main
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image: ${{ steps.recipe.outputs.image }}
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      # secureblue's allowlist at 39502947d5612c1fb674cf5cdaff9f6a3ab271c8,
      # with GitHub's API and Proton added for this build.
      - name: Restrict runner egress
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            # Ubuntu packages
            _https._tcp.archive.ubuntu.com:443
            archive.ubuntu.com:443
            _https._tcp.security.ubuntu.com:443
            security.ubuntu.com:443
            _https._tcp.packages.microsoft.com:443
            packages.microsoft.com:443
            _https._tcp.motd.ubuntu.com:443
            motd.ubuntu.com:443
            _https._tcp.esm.ubuntu.com:443
            esm.ubuntu.com:443

            # GitHub Actions, release binaries and verification keys
            github.com:443
            api.github.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            rekor.sigstore.dev:443

            # Container registries and BlueBuild
            quay.io:443
            cdn01.quay.io:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            schema.blue-build.org:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443
            auth.docker.io:443

            # Package repositories and Proton Mail Bridge
            copr.fedorainfracloud.org:443
            download.copr.fedorainfracloud.org:443
            negativo17.org:443
            repo.secureblue.dev:443
            fedoraproject-updates-archive.fedoraproject.org:443
            formulae.brew.sh:443
            pkgs.tailscale.com:443
            nvidia.github.io:443
            keyserver.ubuntu.com:443
            proton.me:443

            # Fedora mirrors, following secureblue's allowlist
            abqix.mm.fcix.net:443
            cfhcable.mm.fcix.net:443
            codingflyboy.mm.fcix.net:443
            cofractal-ewr.mm.fcix.net:443
            cofractal-sea.mm.fcix.net:443
            coresite-atl.mm.fcix.net:443
            coresite.mm.fcix.net:443
            d2lzkl7pfhq30w.cloudfront.net:443
            dfw.mirror.rackspace.com:443
            dl.fedoraproject.org:443
            download-cc-rdu01.fedoraproject.org:443
            download-ib01.fedoraproject.org:443
            fdix-ind.mm.fcix.net:443
            fedora-mirror-atl.gigsouth.com:443
            fedora.mirror.constant.com:443
            forksystems.mm.fcix.net:443
            ftp2.osuosl.org:443
            ftp-chi.osuosl.org:443
            ftp-nyc.osuosl.org:443
            ftp-osl.osuosl.org:443
            gigsouth.mm.fcix.net:443
            iad.mirror.rackspace.com:443
            insect.mm.fcix.net:443
            irltoolkit.mm.fcix.net:443
            ix-denver.mm.fcix.net:443
            lesnet.mm.fcix.net:443
            lolhost.mm.fcix.net:443
            mirror.cpsc.ucalgary.ca:443
            mirror.csclub.uwaterloo.ca:443
            mirror.cs.princeton.edu:443
            mirror.cs.siue.edu:443
            mirror.dst.ca:443
            mirror.fcix.net:443
            mirror.lstn.net:443
            mirror.math.princeton.edu:443
            mirror.servaxnet.com:443
            mirrors.fedoraproject.org:443
            mirrors.mit.edu:443
            mirrors.xmission.com:443
            mirror.us.mirhosting.net:443
            mirror.web-ster.com:443
            mirror.xenyth.net:443
            muug.ca:443
            na.edge.kernel.org:443
            nnenix.mm.fcix.net:443
            nocix.mm.fcix.net:443
            nullroute.mm.fcix.net:443
            ohioix.mm.fcix.net:443
            opencolo.mm.fcix.net:443
            ord.mirror.rackspace.com:443
            paducahix.mm.fcix.net:443
            pubmirror1.math.uh.edu:443
            pubmirror2.math.uh.edu:443
            pubmirror3.math.uh.edu:443
            ryamer.mm.fcix.net:443
            sjc.mirror.rackspace.com:443
            solidrock.mm.fcix.net:443
            southfront.mm.fcix.net:443
            stix.mm.fcix.net:443
            us.mirrors.cicku.me:443
            veronanetworks.mm.fcix.net:443
            volico.mm.fcix.net:443
            yxeix.mm.fcix.net:443
            yycix.mm.fcix.net:443
            ziply.mm.fcix.net:443

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read recipe
        id: recipe
        run: |
          {
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$(yq -r '.name' recipes/recipe.yml)"
            echo "base=$(yq -r '."base-image"' recipes/recipe.yml)"
            echo "base_tag=$(yq -r '."image-version"' recipes/recipe.yml)"
          } >> "$GITHUB_OUTPUT"

      # The update check on your machine must look for the image this run
      # builds, from this repo. Catches a renamed repo or recipe.
      - name: Check verify-provenance.sh
        env:
          IMAGE: ${{ steps.recipe.outputs.image }}
        run: |
          f=files/system/usr/libexec/secureblue/verify-provenance.sh
          if ! grep -qx "readonly IMAGE=${IMAGE}" "$f" ||
             ! grep -qx "readonly SOURCE=github.com/${GITHUB_REPOSITORY,,}" "$f"; then
            echo "::error::$f must point at ${IMAGE} and github.com/${GITHUB_REPOSITORY,,}"
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.0

      - name: Install slsa-verifier
        uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1

      - name: Install regctl
        uses: regclient/actions/regctl-installer@1b705e32d40851370799ea5814e83d0a5f6a70dc # v0.1.0

      # Same check secureblue's own pipeline does on its base images: the
      # base must be signed with secureblue's key (vendored in keys/) and
      # built by secureblue's workflow from their `live` branch.
      - name: Verify secureblue base image
        id: base
        env:
          BASE: ${{ steps.recipe.outputs.base }}
          BASE_TAG: ${{ steps.recipe.outputs.base_tag }}
        run: |
          digest=$(regctl image digest "${BASE}:${BASE_TAG}")
          cosign verify --key keys/secureblue.pub "${BASE}@${digest}" > /dev/null
          slsa-verifier verify-image \
            --source-uri github.com/secureblue/secureblue \
            --source-branch live \
            "${BASE}@${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          # As in secureblue's pipeline: let BlueBuild's verify_install
          # reinstall slsa-verifier without clashing with this copy.
          rm -rf ~/.slsa/

      - name: Build, sign and push
        uses: blue-build/github-action@c295af864f2802fc6aea227507af43d35823db81 # v1.13.0
        with:
          # Same CLI version as secureblue, verified before use. Bump it when they do.
          cli_version: v0.9.37
          verify_install: true
          retry_push_count: 3
          recipe: recipe.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          skip_checkout: true
          maximize_build_space: true

      - name: Read pushed digest
        id: digest
        env:
          IMAGE: ${{ steps.recipe.outputs.image }}
          TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$TOKEN" | regctl registry login ghcr.io --user "$GITHUB_ACTOR" --pass-stdin
          echo "digest=$(regctl image digest "${IMAGE}:latest")" >> "$GITHUB_OUTPUT"

      # BlueBuild looks up the base digest again when it builds. Fail if
      # secureblue pushed a new image in between, so the unverified build
      # gets no provenance and your machine won't take it.
      - name: Check base image of the build
        env:
          IMAGE: ${{ steps.recipe.outputs.image }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          VERIFIED: ${{ steps.base.outputs.digest }}
        run: |
          built_on=$(regctl image config "${IMAGE}@${DIGEST}" |
            jq -r '.config.Labels["org.opencontainers.image.base.digest"]')
          if [[ $built_on != "$VERIFIED" ]]; then
            echo "::error::built on base ${built_on}, but verified ${VERIFIED}"
            exit 1
          fi

  # Signed statement from GitHub that this digest was built by this
  # workflow, from this repo and branch. verify-provenance.sh on your
  # machine checks it before every update.
  provenance:
    name: Provenance
    needs: build
    permissions:
      actions: read
      id-token: write
      packages: write
    # Must be referenced by tag, not commit SHA: the generator checks its own ref.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.build.outputs.image }}
      digest: ${{ needs.build.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
